<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Hearts of Iron Chron</title>
  <!--
    Named explicitly because a browser asks for /favicon.ico on every page load
    whether or not one is declared. Left undeclared it guesses that path, finds
    nothing, and puts a 404 in the server log on every reload.
  -->
  <link rel="icon" href="./data/icons/capital.png">
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>

  <!--
    Shown first, over everything. The map loads behind it, and the button stays
    disabled until it is ready — so pressing Enter always lands on a finished
    map rather than a half-drawn one.
  -->
  <div id="start">
    <div class="start-panel">
      <h1>Hearts of Iron Chron</h1>
      <button id="start-enter" disabled>Loading&hellip;</button>
      <p>
        Hearts of Iron Chron is the placeholder name of this in-development game.
        Currently, there is no game to speak of so have fun looking at an
        imcomplete map.
      </p>
    </div>
  </div>

  <div id="map-area">
    <div id="toolbar" class="milled">
      <span class="wordmark">Hearts of Iron Chron<b>Third Sapient War</b></span>

      <span class="sep"></span>

      <button data-mode="political" class="active">Political</button>
      <button data-mode="province">Provinces</button>
      <button data-mode="terrain">Terrain</button>

      <span class="sep"></span>

      <span id="zoom-group">
        <button id="zoom-out" title="Zoom out (&minus;)">&minus;</button>
        <span id="zoom-level">100%</span>
        <button id="zoom-in" title="Zoom in (+)">+</button>
        <button id="zoom-fit" title="Fit to window (0)">Fit</button>
      </span>

      <span class="sep"></span>

      <button id="toggle-panel" title="Debug menu (`)">Debug</button>
    </div>

    <div id="canvas-wrap">
      <canvas id="map"></canvas>
      <div id="tooltip" hidden></div>
    </div>
  </div>

  <!-- Development inspector. Closed until the backtick key adds .open; see §7 of main.js.
       The inner div is what scrolls. The panel itself must stay still, because it
       holds the texture overlay and a texture that slid with the content would
       expose bare surface at the end of a scroll. -->
  <div id="panel" class="milled">
    <div id="panel-scroll">
      <h1>Overlays</h1>
      <div id="toggles" class="toggles">
        <!-- data-repaint marks a toggle that changes the painted map rather than
             just what is drawn over it, so it needs the buffer rebuilt. -->
        <button id="toggle-satellite" data-toggle="satellite" data-repaint>Satellite</button>
        <button data-toggle="showCities" class="active">Cities</button>
        <button data-toggle="showLabels" class="active">Polity labels</button>
        <button data-toggle="showProvinceNames">Province names</button>
        <button data-toggle="showChunks">Chunk grid</button>
        <button data-toggle="showAdjacency">Adjacency links</button>
        <button data-toggle="showBounds">Selection bounds</button>
        <button data-toggle="showCoastal">Coastal flags</button>
      </div>

      <h1>Performance</h1>
      <div id="perf"></div>

      <h1>Map</h1>
      <div id="stats"></div>

      <h1>Selected</h1>
      <h2 id="sel-name">&mdash;</h2>
      <div id="sel-body" class="hint">Click a province on the map.</div>
      <div id="neighbours"></div>
    </div>
  </div>

  <!--
    Loaded through a dynamic import carrying a timestamp, so the browser can
    never serve a stale copy. A plain src= has no version on it, and a cached
    module looks exactly like a change that silently did not work. main.js
    passes the same token on to its own imports.
  -->
  <script type="module">
    import(`./src/main.js?v=${Date.now()}`);
  </script>
</body>

</html>
