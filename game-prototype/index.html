<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Hearts of Iron Chron</title>
  <style>
    /* ============================================================ palette
       Wartime strategy-map styling. Everything is one family of desaturated
       steel blues; the only "accent" is a lighter, slightly cooler steel, so
       emphasis comes from value and not from a second hue. */
    :root {
      --steel-deepest: #0c1015;
      --steel-deep: #12171e;
      --steel: #1a212a;
      --steel-raised: #222b36;
      --steel-hover: #2b3644;

      --rule: #313d4c;
      --rule-bright: #46566a;

      --accent: #7f97b2;
      /* selected / interactive */
      --accent-bright: #a8bdd4;
      --accent-dim: #3f5064;

      --paper: #dfe5ec;
      /* the brightest text gets */
      --text: #b9c2cf;
      --dim: #78849a;

      /* One place, because the panel's slide parks it at exactly minus its width. */
      --panel-w: 320px;

      --shadow: 0 2px 10px rgba(0, 0, 0, .55);
      --bevel: inset 0 1px 0 rgba(255, 255, 255, .06), inset 0 -1px 0 rgba(0, 0, 0, .35);
    }

    * {
      box-sizing: border-box;
    }

    /* Faint diagonal weave, used on every raised surface for a milled-metal feel. */
    .milled {
      background-image:
        repeating-linear-gradient(135deg,
          rgba(255, 255, 255, .014) 0 2px,
          transparent 2px 4px);
    }

    body {
      margin: 0;
      background: var(--steel-deepest);
      color: var(--text);
      font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* =============================================================== map */
    #map-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #toolbar {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 0 14px;
      height: 52px;
      flex: none;
      background: linear-gradient(180deg, var(--steel-raised), var(--steel-deep));
      border-bottom: 1px solid #000;
      box-shadow: 0 1px 0 rgba(255, 255, 255, .05) inset, 0 3px 12px rgba(0, 0, 0, .5);
      position: relative;
      z-index: 5;
    }

    /* Cool hairline under the toolbar, the one horizontal accent in the chrome. */
    #toolbar::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-dim) 12%, var(--accent-dim) 88%, transparent);
    }

    .wordmark {
      font-size: 13px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--paper);
      white-space: nowrap;
      text-shadow: 0 1px 2px #000;
      padding-right: 4px;
    }

    .wordmark b {
      display: block;
      font-size: 9px;
      letter-spacing: .3em;
      font-weight: 400;
      color: var(--dim);
    }

    .sep {
      width: 1px;
      height: 26px;
      margin: 0 8px;
      background: linear-gradient(180deg, transparent, var(--rule), transparent);
      flex: none;
    }

    /* --------------------------------------------------------- buttons */
    #toolbar button {
      background: linear-gradient(180deg, var(--steel-raised), #171d25);
      color: var(--text);
      border: 1px solid var(--rule);
      border-radius: 2px;
      padding: 6px 13px;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      letter-spacing: .1em;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: var(--bevel);
      transition: border-color .12s, color .12s, background .12s;
    }

    #toolbar button:hover {
      background: linear-gradient(180deg, var(--steel-hover), #1d242e);
      border-color: var(--rule-bright);
      color: #dfe5ee;
    }

    #toolbar button:active {
      background: #12171e;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, .6);
    }

    /* Active reads as a panel lit from above and pushed forward, rather than as
       a differently coloured plate — value and a bright top edge, not a hue. */
    #toolbar button.active {
      background: linear-gradient(180deg, #46586e, #2b3746);
      border-color: var(--rule-bright);
      border-top-color: var(--accent);
      color: var(--paper);
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .6);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 0 0 1px rgba(0, 0, 0, .3);
    }

    #toolbar button.active:hover {
      background: linear-gradient(180deg, #506480, #313e4f);
    }

    #toolbar button:focus-visible {
      outline: 1px solid var(--accent-bright);
      outline-offset: 2px;
    }

    /* Shown when the optional data behind a button is missing, e.g. no imagery. */
    #toolbar button:disabled {
      opacity: .38;
      cursor: not-allowed;
      background: linear-gradient(180deg, #1b222b, #151a21);
    }

    #toolbar button:disabled:hover {
      border-color: var(--rule);
      color: var(--text);
    }

    #zoom-group {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    #zoom-group button {
      width: 32px;
      padding: 6px 0;
      text-align: center;
      font-size: 14px;
      line-height: 1;
    }

    #zoom-group #zoom-fit {
      width: auto;
      padding: 6px 11px;
      font-size: 12px;
    }

    #zoom-level {
      min-width: 56px;
      text-align: center;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      letter-spacing: .06em;
    }

    /* ---------------------------------------------------------- canvas */
    #canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--steel-deepest);
    }

    /* Vignette, so the map reads as lit from the centre. Must not eat clicks. */
    #canvas-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0, 0, 0, .38) 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    canvas.panning {
      cursor: grabbing;
    }

    #tooltip {
      position: absolute;
      z-index: 10;
      pointer-events: none;
      /* never let the tooltip sit under the cursor and eat the next event */
      background: linear-gradient(180deg, rgba(34, 43, 54, .97), rgba(16, 21, 27, .97));
      border: 1px solid var(--rule-bright);
      border-top-color: var(--accent-dim);
      border-radius: 2px;
      padding: 7px 11px;
      font-size: 13px;
      line-height: 1.4;
      white-space: nowrap;
      color: var(--paper);
      box-shadow: var(--shadow);
    }

    #tooltip .sub {
      color: var(--dim);
      font-size: 12px;
    }

    /* ================================================ side panel (dev only)
       Closed unless toggled with the backtick key, and it must take up no space
       at all when closed so the map gets the full width.

       It slides on a negative margin rather than a transform: the margin is what
       the flex layout measures, so the map grows into the space as the panel
       leaves, instead of the panel gliding over a map that has already resized.
       Its own width never changes, so the text inside does not reflow mid-slide.
       display:none is not usable here — it cannot be transitioned. */
    #panel {
      width: var(--panel-w);
      margin-right: calc(-1 * var(--panel-w));
      /* parked just off the right edge */
      visibility: hidden;
      flex: none;
      transition: margin-right .3s cubic-bezier(.22, .61, .36, 1),
        visibility 0s .3s;
      /* stays visible until the slide finishes */

      background: linear-gradient(180deg, var(--steel), var(--steel-deep));
      border-left: 1px solid #000;
      box-shadow: -3px 0 14px rgba(0, 0, 0, .5);
      padding: 18px 18px 24px;
      overflow-y: auto;
      position: relative;
      scrollbar-width: thin;
      scrollbar-color: var(--rule) var(--steel-deepest);
    }

    #panel.open {
      margin-right: 0;
      visibility: visible;
      transition: margin-right .3s cubic-bezier(.22, .61, .36, 1),
        visibility 0s 0s;
      /* but appears immediately on the way in */
    }

    @media (prefers-reduced-motion: reduce) {

      #panel,
      #panel.open {
        transition: none;
      }
    }

    /* Matching hairline down the panel's inner edge. */
    #panel::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 1px;
      background: linear-gradient(180deg, transparent, var(--accent-dim) 8%, var(--accent-dim) 92%, transparent);
    }

    /* Section headings: "SELECTED", "ADJACENT PROVINCES". */
    #panel h1 {
      font-size: 10px;
      margin: 0 0 6px;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--dim);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    #panel h1::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--rule), transparent);
    }

    /* The selected province's name — the one piece of display type. */
    #panel h2 {
      font: 400 23px/1.25 Georgia, "Times New Roman", serif;
      margin: 0 0 16px;
      color: var(--paper);
      letter-spacing: .01em;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .6);
      border-bottom: 1px solid var(--rule);
      padding-bottom: 12px;
    }

    /* ------------------------------------------------ overlay toggles */
    .toggles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      margin-bottom: 22px;
    }

    .toggles button {
      display: flex;
      align-items: center;
      gap: 7px;
      background: linear-gradient(180deg, var(--steel-raised), #171d25);
      color: var(--dim);
      border: 1px solid var(--rule);
      border-radius: 2px;
      padding: 6px 8px;
      font: inherit;
      font-size: 11px;
      letter-spacing: .04em;
      text-align: left;
      cursor: pointer;
      box-shadow: var(--bevel);
      transition: border-color .12s, color .12s;
    }

    .toggles button:hover {
      border-color: var(--rule-bright);
      color: var(--text);
    }

    /* A lamp rather than a fill, so a row of them is readable at a glance. */
    .toggles button::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 1px;
      border: 1px solid var(--rule-bright);
      flex: none;
    }

    .toggles button.active {
      color: var(--paper);
      border-color: var(--rule-bright);
    }

    .toggles button.active::before {
      background: var(--accent);
      border-color: var(--accent-bright);
      box-shadow: 0 0 5px rgba(127, 151, 178, .7);
    }

    .toggles button:focus-visible {
      outline: 1px solid var(--accent-bright);
      outline-offset: 2px;
    }

    /* --------------------------------------------------- data readout */
    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(49, 61, 76, .5);
      font-size: 13px;
    }

    .row span:first-child {
      color: var(--dim);
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: 11px;
      align-self: center;
    }

    .row span:last-child {
      color: var(--paper);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .swatch {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 1px;
      margin-right: 7px;
      vertical-align: baseline;
      border: 1px solid rgba(0, 0, 0, .55);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .07);
    }

    /* ------------------------------------------------ neighbour list */
    #neighbours {
      margin-top: 22px;
    }

    #neighbours ul {
      list-style: none;
      margin: 9px 0 0;
      padding: 0;
    }

    #neighbours li {
      padding: 6px 10px;
      margin-bottom: 3px;
      border-radius: 2px;
      background: var(--steel-raised);
      border: 1px solid transparent;
      border-left: 2px solid var(--rule);
      cursor: pointer;
      font-size: 13px;
      transition: background .12s, border-color .12s, color .12s;
    }

    #neighbours li:hover {
      background: var(--steel-hover);
      border-left-color: var(--accent);
      color: var(--paper);
    }

    .hint {
      color: var(--dim);
      font-size: 13px;
      font-style: italic;
    }

    /* Readout blocks share the .row layout but sit tighter than the main list. */
    #perf,
    #stats {
      margin-bottom: 22px;
    }

    #perf .row,
    #stats .row {
      padding: 4px 0;
      font-size: 12px;
    }

    #perf .row span:last-child,
    #stats .row span:last-child {
      color: var(--text);
    }

    /* Flags a figure that has gone outside its healthy range. */
    .warn {
      color: #d98c5f !important;
    }

    /* ------------------------------------------------------ scrollbar */
    #panel::-webkit-scrollbar {
      width: 10px;
    }

    #panel::-webkit-scrollbar-track {
      background: var(--steel-deepest);
    }

    #panel::-webkit-scrollbar-thumb {
      background: var(--rule);
      border: 2px solid var(--steel-deepest);
      border-radius: 5px;
    }

    #panel::-webkit-scrollbar-thumb:hover {
      background: var(--rule-bright);
    }

    /* Narrow windows: the panel would otherwise crowd out the map. */
    @media (max-width: 900px) {

      /* Narrowing the variable keeps the parked position in step with the width. */
      :root {
        --panel-w: 250px;
      }

      #panel {
        padding: 14px;
      }

      .wordmark b {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div id="map-area">
    <div id="toolbar" class="milled">
      <span class="wordmark">Hearts of Iron Chron<b>Third Sapient War</b></span>

      <span class="sep"></span>

      <button data-mode="political" class="active">Political</button>
      <button data-mode="province">Provinces</button>
      <button data-mode="terrain">Terrain</button>

      <span class="sep"></span>

      <button id="toggle-satellite" title="Satellite imagery beneath the province colours">Satellite</button>

      <span class="sep"></span>

      <span id="zoom-group">
        <button id="zoom-out" title="Zoom out (&minus;)">&minus;</button>
        <span id="zoom-level">100%</span>
        <button id="zoom-in" title="Zoom in (+)">+</button>
        <button id="zoom-fit" title="Fit to window (0)">Fit</button>
      </span>

      <span class="sep"></span>

      <button id="toggle-panel" title="Debug menu (`)">Debug</button>
    </div>

    <div id="canvas-wrap">
      <canvas id="map"></canvas>
      <div id="tooltip" hidden></div>
    </div>
  </div>

  <!-- Development inspector. Closed until the backtick key adds .open; see §7 of main.js. -->
  <div id="panel" class="milled">
    <h1>Overlays</h1>
    <div id="toggles" class="toggles">
      <button data-toggle="showLabels" class="active">Polity labels</button>
      <button data-toggle="showProvinceNames">Province names</button>
      <button data-toggle="showChunks">Chunk grid</button>
      <button data-toggle="showAdjacency">Adjacency links</button>
      <button data-toggle="showBounds">Selection bounds</button>
      <button data-toggle="showCoastal">Coastal flags</button>
    </div>

    <h1>Performance</h1>
    <div id="perf"></div>

    <h1>Map</h1>
    <div id="stats"></div>

    <h1>Selected</h1>
    <h2 id="sel-name">&mdash;</h2>
    <div id="sel-body" class="hint">Click a province on the map.</div>
    <div id="neighbours"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
